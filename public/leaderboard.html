<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#262d36">
  <title>QSB rewards leaderboard</title>
  <link rel="icon" href="/media/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/claim-component.css">
</head>
<body>
  <header class="yr-bar">
    <div class="yr-bar-inner">
      <div class="yr-lockup"><a class="yr-brand" href="https://www.yukon.org">Yukon</a><span class="yr-lockup-rule" aria-hidden="true"></span><a class="yr-brand-qsb" href="https://www.yukon.org/qsb">Quantum Safe Bitcoin</a><span class="yr-lockup-with">with</span><a class="yr-starkware" href="https://starkware.co/" target="_blank" rel="noreferrer" aria-label="StarkWare"><img src="/media/starkware-logo.svg" alt="" width="201" height="33"></a></div>
      <div class="yr-top-right"><a class="yr-navlink" href="/qsb/rewards">Claim your reward</a><span id="claim-connect" class="yr-header-cta"></span></div>
    </div>
  </header>
  <main class="yr-page yr-board-page">
    <section class="yr-claim-card">
      <div class="yr-board-head">
        <p class="yr-board-badge">Week 1 winners only</p>
        <h1>Who is getting paid</h1>
      </div>
      <section id="yr-winners" class="yr-winners" aria-label="Weekly winners"></section>
      <section class="yr-standings">
        <h2>Weekly standings</h2>
        <div id="yr-rest" class="yr-rest"></div>
      </section>
      <p id="yr-board-note" class="yr-board-note"></p>
    </section>
  </main>
  <script type="module" src="/leaderboard.js"></script>
</body>
</html>
